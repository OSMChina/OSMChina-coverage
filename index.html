<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>OSMChina 完备度可视化</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="icon" href="https://osmchina.oss-accelerate.aliyuncs.com/static/favicon.ico" />
</head>

<body>
  <div id="app">

    <div id="side-panel">
      <div id="panel-content">
        <h2>OSMChina 乡镇要素完备度可视化地图</h2>
        <p>这个地图可以用来查看中国大陆乡镇的 OSM 基础要素数据完备度。OSM 中国的编辑者可以使用这个工具验证目前中国数据缺失的部分。数据的统计时间为 2026 年 1 月。</p>
        <p><b>数据来源：</b><a href="https://www.openstreetmap.org/user/Higashimado/diary/407990" target="_blank"
            rel="noopener noreferrer">2025 年中国大陆乡镇 OSM 要素完备度分析报告</a></p>
        <p><b>项目主页：</b><a href="https://github.com/OSMChina/OSMChina-coverage" target="_blank" rel="noopener noreferrer">OSMChina/OSMChina-coverage</a></p>
      </div>

      <div id="color-legend" class="color-legend">
        <div class="colorbar">
          <div id="color-pointer" class="color-pointer">
            <div class="pointer-triangle"></div>
            <div class="pointer-line"></div>
          </div>
        </div>
        <div class="colorbar-labels">
          <span>0</span>
          <span>20</span>
          <span>40</span>
          <span>60</span>
          <span>80</span>
          <span>100</span>
        </div>
      </div>
    </div>

    <div id="map"></div>  

    <div id="range-panel">
      <div id="filters">
        <h3>筛选器</h3>

        <div class="slider-group">
          <label>行政节点和边界</label>
          <div class="range-row">
            <span class="range-value" id="score1-min-text">0</span>
            <div class="slider-container" id="score1-slider">
              <div class="slider-track"></div>
              <input type="range" id="score1-min" min="0" max="20" value="0" class="thumb thumb-min">
              <input type="range" id="score1-max" min="0" max="20" value="20" class="thumb thumb-max">
            </div>
            <span class="range-value" id="score1-max-text">20</span>
          </div>
        </div>

        <div class="slider-group">
          <label>道路交通</label>
          <div class="range-row">
            <span class="range-value" id="score2-min-text">0</span>
            <div class="slider-container" id="score2-slider">
              <div class="slider-track"></div>
              <input type="range" id="score2-min" min="0" max="30" value="0" class="thumb thumb-min">
              <input type="range" id="score2-max" min="0" max="30" value="30" class="thumb thumb-max">
            </div>
            <span class="range-value" id="score2-max-text">30</span>
          </div>
        </div>

        <div class="slider-group">
          <label>公共和商业设施</label>
          <div class="range-row">
            <span class="range-value" id="score3-min-text">0</span>
            <div class="slider-container" id="score3-slider">
              <div class="slider-track"></div>
              <input type="range" id="score3-min" min="0" max="30" value="0" class="thumb thumb-min">
              <input type="range" id="score3-max" min="0" max="30" value="30" class="thumb thumb-max">
            </div>
            <span class="range-value" id="score3-max-text">30</span>
          </div>
        </div>

        <div class="slider-group">
          <label>建筑和土地利用</label>
          <div class="range-row">
            <span class="range-value" id="score4-min-text">0</span>
            <div class="slider-container" id="score4-slider">
              <div class="slider-track"></div>
              <input type="range" id="score4-min" min="0" max="20" value="0" class="thumb thumb-min">
              <input type="range" id="score4-max" min="0" max="20" value="20" class="thumb thumb-max">
            </div>
            <span class="range-value" id="score4-max-text">20</span>
          </div>
        </div>

        <div class="slider-group">
          <label>总分</label>
          <div class="range-row">
            <span class="range-value" id="score0-min-text">0</span>
            <div class="slider-container" id="score0-slider">
              <div class="slider-track"></div>
              <input type="range" id="score0-min" min="0" max="100" value="0" class="thumb thumb-min">
              <input type="range" id="score0-max" min="0" max="100" value="100" class="thumb thumb-max">
            </div>
            <span class="range-value" id="score0-max-text">100</span>
          </div>
        </div>
      </div>

      <div class="filter-section">
        <div class="checkbox-group">
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-node">
            无节点
          </label>
        
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-boundary">
            无边界
          </label>
        
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-road">
            无道路
          </label>
        
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-building">
            无建筑
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-gov">
            无机关
          </label>
          
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-shop">
            无商店
          </label>
          
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-school">
            无学校
          </label>
          
          <label class="checkbox-item">
            <input type="checkbox" id="filter-no-health">
            无医院
          </label>
        </div>
      </div>
    </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
